services:
  gdcm-map:
    # 镜像由 GitHub Actions 构建并推送到 GHCR，服务器仅需 docker pull，无需本地编译
    image: ghcr.io/w311ang/gdcm-map:latest
    pull_policy: always
    container_name: gdcm-map
    restart: unless-stopped
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    ports:
      # 仅绑定到宿主机回环地址，只允许宿主机上的 Caddy 反代访问，不直接暴露到公网
      - "127.0.0.1:12856:80"
