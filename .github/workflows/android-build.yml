name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate capacitor.config.json from template
        # 真实域名不写入仓库，由仓库 Secrets 中的 MAP_SERVER_URL 在构建时注入
        env:
          MAP_SERVER_URL: ${{ secrets.MAP_SERVER_URL }}
        run: |
          if [ -z "$MAP_SERVER_URL" ]; then
            echo "::error::请在仓库 Settings > Secrets and variables > Actions 中添加 MAP_SERVER_URL"
            exit 1
          fi
          sed "s#__CAPACITOR_SERVER_URL__#${MAP_SERVER_URL}#" capacitor.config.template.json > capacitor.config.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdcm-map-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
